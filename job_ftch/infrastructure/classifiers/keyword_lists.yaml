# Strong, near-exclusive vacancy signals. Checked BEFORE announcement so a real
# job post that merely mentions a hackathon / meetup / course / conference
# (e.g. "ищем ML-инженера, проводим хакатоны") is not mis-routed to announcement
# and hard-dropped. Keep this list conservative: only tokens that almost never
# appear outside an actual hiring post.
job_posting_strong:
  # Russian — explicit vacancy / hiring intent
  - "вакансия"
  - "вакансии"
  - "#вакансия"
  - "открыта вакансия"
  - "открыта позиция"
  - "ищем специалист"
  - "ищем разработчик"
  - "ищем инженер"
  - "мы ищем"
  - "требуется"
  - "нужен разработчик"
  - "нужен инженер"
  - "нужен специалист"
  - "нанимаем"
  - "нанимает"
  - "трудоустройство"
  # Russian — job content sections (near-exclusive to actual job postings)
  - "обязанности"
  - "что предстоит делать"
  - "заработная плата"
  - "условия работы"
  - "требования к кандидату"
  # Russian — compensation (near-exclusive to job posts)
  - "з/п"
  - "зарплата"
  - "вилка"
  - "грейд"
  - "грейды"
  - "требования"
  - "навыки"
  - "навыки:"
  - "квалификация"
  # English — explicit hiring intent
  - "we are hiring"
  - "we're hiring"
  - "#hiring"
  - "#vacancy"
  - "#job"
  - "apply now"
  - "send your cv"
  - "send your resume"
  - "join our team"
