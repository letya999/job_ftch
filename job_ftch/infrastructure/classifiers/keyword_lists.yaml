# Keyword lists for the heuristic post-type classifier (per Wave 2.9.3).
#
# Each list is a flat tuple of substrings. The classifier lower-cases the
# text and checks each token via `in` (substring match). Operators can
# extend or override these without touching code by editing this file;
# the loader caches by file mtime so per-run overhead is one stat call.
#
# Categories:
#   announcement  - events, digests, podcasts, meetups, courses, ML
#                   competitions. Not a job, not a CV.
#   job_posting   - the actual vacancy post. Strong and weak signals.
#   candidate     - someone offering themselves ("open to work",
#                   "ищу работу", "looking for a role").
#   spam          - off-topic: bookmakers, casinos, crypto-shilling.
#
# Strings are kept in their natural casing; the loader lowercases on read.

