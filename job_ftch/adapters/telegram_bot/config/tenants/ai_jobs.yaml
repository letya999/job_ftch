# Tenant config consumed by the Telegram bot via TenantRunner.
# Infra secrets/connection details (OpenAI key/model, Qdrant URL, Postgres DSN)
# are inherited from the environment (.env.dev/.env.prod); only backend
# selection and sources live here so the file stays portable across local and
# container runs.
tenant_id: ai_jobs
display_name: AI Jobs RU/KZ

source_backend: telegram_channel
sources:
  - type: telegram_channel
    entity: ml_jobs_kz
    limit: 100
    source_name: ml_jobs_kz
  - type: telegram_channel
    entity: remote_ai_jobs
    limit: 100
    source_name: remote_ai_jobs
  - type: telegram_channel
    entity: forproducts
    limit: 100
    source_name: forproducts
  - type: telegram_channel
    entity: gleb_pro_ai
    limit: 100
    source_name: gleb_pro_ai
  - type: telegram_group
    entity: ai_engineers_guild
    limit: 100
    source_name: ai_engineers_guild
  # One bare entry URL per host. Search queries are generated on the fly from the
  # tenant's target roles by expand_career_site_specs after source assessment
  # selects a specific URL/API or generic GET/POST/browser search recipe.
  # Do NOT hardcode ?text=/?q=/?keywords= here: it pins a stale query and disables
  # that dynamic expansion.
  - type: career_site
    url: https://geekjob.ru/vacancies
    source_name: geekjob_ru
    limit: 50
  - type: career_site
    url: https://hh.ru/search/vacancy
    source_name: hh_ru
    limit: 50
  - type: career_site
    url: https://hh.kz/search/vacancy
    source_name: hh_kz
    limit: 50
  - type: career_site
    url: https://yandex.ru/jobs/vacancies
    source_name: yandex_jobs
    limit: 50
  - type: career_site
    url: https://www.superjob.ru/vacancy/search/
    source_name: superjob_ru
    limit: 50
    bypass: cloak
    monitor: dom
    monitor_config:
      render: true
      wait: domcontentloaded
      settle_seconds: 1
      url_filter: "www\\.superjob\\.ru/vakansii/[^/?#]+-\\d+\\.html$"
  - type: career_site
    url: https://rabota.sber.ru/search
    source_name: rabota_sber_ru
    limit: 50
  - type: career_site
    url: https://www.tbank.ru/career/vacancies/it/
    source_name: tbank_it
    limit: 50
  - type: career_site
    url: https://team.vk.company/vacancy/
    source_name: vk_careers
    limit: 50
  - type: career_site
    url: https://career.avito.com/vacancies/
    source_name: avito_careers
    limit: 50
  - type: career_site
    url: https://career.habr.com/vacancies
    source_name: habr_career
    limit: 50
  - type: career_site
    url: https://kolesa.group/career/job
    source_name: kolesa_group
    limit: 50
  - type: career_site
    url: https://hirify.me/jobs-in-russia
    source_name: hirify_me
    limit: 50

# Library backends: Postgres store. LLM and embedding policy inherit from
# config/runtime.yaml + config/runtime.prod.yaml; do not duplicate model
# settings here.
store_backend: postgres
job_group_store_backend: postgres
job_backend: postgres
search_backend: hybrid
search_language: russian

notify_mode: digest
notify_batch_size: 10
