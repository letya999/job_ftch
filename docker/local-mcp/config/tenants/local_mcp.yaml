# Local MCP tenant: SQLite everywhere, no cloud stores.
# Sources: fixtures/sources/ai_jobs.json (17) — production test set.
tenant_id: local_mcp
display_name: Local MCP (SQLite)

sources:
  # Telegram (5)
  - type: telegram_channel
    entity: ml_jobs_kz
    limit: 100
    source_name: ml_jobs_kz
  - type: telegram_channel
    entity: remote_ai_jobs
    limit: 100
    source_name: remote_ai_jobs
  - type: telegram_channel
    entity: forproducts
    limit: 100
    source_name: forproducts
  - type: telegram_channel
    entity: gleb_pro_ai
    limit: 100
    source_name: gleb_pro_ai
  - type: telegram_group
    entity: ai_engineers_guild
    limit: 100
    source_name: ai_engineers_guild
  # Career sites (12) — bare entry URL; per-role search expanded at runtime
  - type: career_site
    url: https://geekjob.ru/vacancies
    source_name: geekjob_ru
    limit: 50
  - type: career_site
    url: https://hh.ru/search/vacancy
    source_name: hh_ru
    limit: 50
  - type: career_site
    url: https://hh.kz/search/vacancy
    source_name: hh_kz
    limit: 50
  - type: career_site
    url: https://yandex.ru/jobs/vacancies
    source_name: yandex_jobs
    limit: 50
  - type: career_site
    url: https://www.superjob.ru/vacancy/search/
    source_name: superjob_ru
    limit: 50
  - type: career_site
    url: https://rabota.sber.ru/search
    source_name: rabota_sber_ru
    limit: 50
  - type: career_site
    url: https://www.tbank.ru/career/vacancies/it/
    source_name: tbank_it
    limit: 50
  - type: career_site
    url: https://team.vk.company/vacancy/
    source_name: vk_careers
    limit: 50
  - type: career_site
    url: https://career.avito.com/vacancies/
    source_name: avito_careers
    limit: 50
  - type: career_site
    url: https://career.habr.com/vacancies
    source_name: habr_career
    limit: 50
  - type: career_site
    url: https://kolesa.group/career/job
    source_name: kolesa_group
    limit: 50
  - type: career_site
    url: https://hirify.me/jobs-in-russia
    source_name: hirify_me
    limit: 50

store_backend: sqlite
job_group_store_backend: sqlite
job_backend: sqlite
search_backend: sqlite
store_path: /data/{tenant_id}/store.db
job_store_path: /data/{tenant_id}/jobs.db

notify_mode: digest
notify_batch_size: 10

sink_backend: none
output:
  backend: none
  path: /data/{tenant_id}/artifacts/latest.json

review_output:
  backend: store
  path: /data/{tenant_id}/artifacts/review.jsonl
  jsonl: true
  schema_version: job_ftch.review.v1

rejected_output:
  backend: store
  path: /data/{tenant_id}/artifacts/rejected.jsonl
  jsonl: true
  schema_version: job_ftch.rejected.v1
