name: job-ftch-observability

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.90.3
    restart: unless-stopped
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_USER_EMAIL:?set OPENOBSERVE_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_USER_PASSWORD:?set OPENOBSERVE_ROOT_USER_PASSWORD}
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve_data:/data

volumes:
  openobserve_data:
