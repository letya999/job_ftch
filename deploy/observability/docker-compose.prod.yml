name: job-ftch-observability

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.90.3
    restart: unless-stopped
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_ROOT_USER_EMAIL: ${JOB_FTCH_OPENOBSERVE_USERNAME:?set JOB_FTCH_OPENOBSERVE_USERNAME}
      ZO_ROOT_USER_PASSWORD: ${JOB_FTCH_OPENOBSERVE_PASSWORD:?set JOB_FTCH_OPENOBSERVE_PASSWORD}
    ports:
      - "127.0.0.1:5080:5080"
    networks:
      - public_site
    volumes:
      - openobserve_data:/data

volumes:
  openobserve_data:

networks:
  public_site:
    name: job_ftch_public
    external: true
