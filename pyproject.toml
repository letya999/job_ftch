[project]
name = "job-ftch"
version = "0.1.0"
description = "Open-source async pipeline for ingesting AI/tech job vacancies from Telegram and career sites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "job_ftch contributors" }]
keywords = ["jobs", "telegram", "pipeline", "async", "open-source"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=0.3",
    "telethon>=1.36",
    "rapidfuzz>=3.9",
    "openai>=1.30",
    "instructor>=1.4",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "structlog>=24.2",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]

[project.entry-points."job_ftch.sources"]

[project.entry-points."job_ftch.parsers"]

[project.entry-points."job_ftch.sinks"]

[project.entry-points."job_ftch.stores"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "bandit[toml]>=1.7",
    "httpx",
    "types-setuptools",
]

# Tell hatchling which Python packages to include in the wheel
[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "nodes", "sinks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Explicit package roots for flat layout
mypy_path = "."
exclude = [
    "^tests/",
    "^\\.venv/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["domain", "application", "infrastructure", "nodes", "sinks"]
omit = ["tests/*", "app.py", "config.py"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
