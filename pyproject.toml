[project]
name = "job-ftch"
version = "0.1.0"
description = "Open-source async pipeline for ingesting AI/tech job vacancies from Telegram and career sites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "job_ftch contributors" }]
keywords = ["jobs", "telegram", "pipeline", "async", "open-source"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=0.3",
    "telethon>=1.36",
    "rapidfuzz>=3.9",
    "openai>=1.30",
    "instructor>=1.4",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "structlog>=24.2",
    "aiosqlite>=0.20",
    "feedparser>=6.0.12",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
embeddings = ["sentence-transformers>=3.0", "torch>=2.3"]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["pgvector>=0.3"]
ollama = ["httpx>=0.27"]
feeds = ["feedparser>=6.0"]
classifiers = [
    "setfit>=0.6.0",
    "sentence-transformers>=2.6.0",
]
all = [
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "qdrant-client>=1.9",
    "pgvector>=0.3",
    "feedparser>=6.0",
    "setfit>=0.6.0",
]

[project.entry-points."job_ftch.sources"]

[project.entry-points."job_ftch.parsers"]

[project.entry-points."job_ftch.sinks"]

[project.entry-points."job_ftch.stores"]

[project.entry-points."job_ftch.job_backends"]

[project.entry-points."job_ftch.search_backends"]

[project.entry-points."job_ftch.embedding_providers"]

[project.entry-points."job_ftch.vector_backends"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "bandit[toml]>=1.7",
    "httpx",
    "types-setuptools",
    "aiosqlite>=0.20",
]

# Tell hatchling which Python packages to include in the wheel
[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "nodes", "sinks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Explicit package roots for flat layout
mypy_path = "."
exclude = [
    "^tests/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
# Optional drivers (aiosqlite, asyncpg) may or may not be installed.
# The try/except ImportError + assignment-to-None pattern triggers
# unused-ignore in envs without the package and assignment-error in envs with it.
# Disabling warn_unused_ignores here keeps both envs happy.
module = [
    "infrastructure.stores.sqlite",
    "infrastructure.stores.postgres",
    "infrastructure.sources.realtime.rss",
    "infrastructure.sources.telegram_realtime",
    "infrastructure.sources.browser.base",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
markers = [
    "e2e: marks tests as end-to-end (deselect with -m 'not e2e')",
    "network: marks tests requiring real network access",
    "telegram: marks tests requiring Telegram credentials",
    "superjob: marks tests requiring SUPERJOB_API_KEY",
]

[tool.coverage.run]
source = ["domain", "application", "infrastructure", "nodes", "sinks"]
omit = ["tests/*", "app.py", "config.py"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
