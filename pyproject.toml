[project]
name = "job-ftch"
version = "0.1.0"
description = "Open-source async pipeline for ingesting AI/tech job vacancies from Telegram and career sites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "job_ftch contributors" }]
keywords = ["jobs", "telegram", "pipeline", "async", "open-source"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=0.3",
    "telethon>=1.36",
    "rapidfuzz>=3.9",
    "openai>=1.30",
    "instructor>=1.4",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "structlog>=24.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "httpx",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "app.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
