name: adapter-faststream

on:
  push:
    paths:
      - "job_ftch/adapters/faststream/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/faststream/**"
      - "job_ftch/**"

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/faststream
      - name: Build image
        run: docker build -f job_ftch/adapters/faststream/Dockerfile -t job-ftch-faststream .
