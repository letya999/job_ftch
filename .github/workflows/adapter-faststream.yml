name: adapter-faststream

on:
  push:
    paths:
      - "job_ftch/adapters/faststream/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/faststream/**"
      - "job_ftch/**"

permissions:
  contents: read

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/faststream
      - name: Build image
        run: docker build -f job_ftch/adapters/faststream/Dockerfile -t job-ftch-faststream .
