# Docs quality gates only. GitHub Pages deploy is docs-pages.yml (main only).
name: Docs

on:
  push:
    branches: [main, dev, mvp-release-final]
  workflow_dispatch:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    name: Docs Just Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Install docs dependencies
        run: |
          uv pip install --reinstall-package markupsafe markupsafe
          uv pip install -r scripts/docs/requirements.txt

      - name: Run docs gates
        run: |
          uv run python scripts/build_index_docs.py --check
          uv run python scripts/lint_docs.py
          uv run python scripts/check_docs_generated.py
          uv run mkdocs build --strict -f scripts/docs/mkdocs.yml
