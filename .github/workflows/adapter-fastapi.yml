name: adapter-fastapi

on:
  push:
    paths:
      - "job_ftch/adapters/fastapi/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/fastapi/**"
      - "job_ftch/**"

permissions:
  contents: read

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/fastapi
      - name: Build image
        run: docker build -f job_ftch/adapters/fastapi/Dockerfile -t job-ftch-fastapi .
