name: security

on:
  pull_request:
  push:
    branches: [main, dev, mvp-release-final]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@f2d9ea762e2d5c93f3fcd1b6c9e8586ff91715bd # main
        with:
          extra_args: --results=verified,unknown --exclude-paths=.repo-safety/trufflehog-exclude.txt
