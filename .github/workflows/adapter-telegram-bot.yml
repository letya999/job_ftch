name: adapter-telegram-bot

on:
  push:
    paths:
      - "job_ftch/adapters/telegram_bot/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/telegram_bot/**"
      - "job_ftch/**"

permissions:
  contents: read

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/telegram_bot
      - name: Validate Dockerfile path
        run: test -f job_ftch/adapters/telegram_bot/Dockerfile.prod
