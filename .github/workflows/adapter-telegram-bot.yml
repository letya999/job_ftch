name: adapter-telegram-bot

on:
  push:
    paths:
      - "job_ftch/adapters/telegram_bot/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/telegram_bot/**"
      - "job_ftch/**"

permissions:
  contents: read

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/telegram_bot
      - name: Validate Dockerfile path
        run: test -f job_ftch/adapters/telegram_bot/Dockerfile.prod
