name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra openai --extra telegram --extra sqlite --extra feeds

      - name: Ruff lint
        run: uv run ruff check .

      - name: Legacy import gate
        run: |
          if rg -n '^from (domain|application|nodes|sinks|infrastructure|config)\b|^import (domain|application|nodes|sinks|infrastructure|config)\b' . -g '*.py' -g '!job_ftch/**'; then
            echo "Legacy flat imports remain outside job_ftch/"
            exit 1
          fi

      - name: Module boundaries
        run: uv run python scripts/check_module_boundaries.py

      - name: Enforce layer boundaries (no infra imports in domain/application/nodes/sinks)
        run: |
          if rg -n '^from job_ftch\.infrastructure|^import job_ftch\.infrastructure' \
              job_ftch/domain job_ftch/application job_ftch/nodes job_ftch/sinks; then
            echo "Layer boundary violation: module-level infrastructure import in a pure layer"; exit 1
          fi

      - name: Ruff format check
        run: uv run ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra openai --extra telegram --extra sqlite --extra feeds

      - name: mypy
        run: uv run mypy job_ftch

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra openai --extra telegram --extra sqlite --extra feeds

      - name: Run tests
        run: uv run pytest tests/ --cov --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra openai --extra telegram --extra sqlite --extra feeds

      - name: Bandit security scan
        run: uv run bandit -r job_ftch scripts/check_module_boundaries.py -ll

      - name: Dependency security audit
        run: uv run pip-audit --ignore-vuln GHSA-w596-868m-8v6m

  core-import-check:
    name: Core Import Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install core package (no extras)
        run: |
          uv venv
          uv pip install .
      - name: Verify core imports without optional dependencies
        run: .venv/bin/python -c "import job_ftch; import job_ftch.application.contracts; import job_ftch.cli"
