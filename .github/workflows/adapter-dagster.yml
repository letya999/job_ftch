name: adapter-dagster

on:
  push:
    paths:
      - "adapters/dagster/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "adapters/dagster/**"
      - "job_ftch/**"

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check adapters/dagster
      - name: Build image
        run: docker build -f adapters/dagster/Dockerfile -t job-ftch-dagster .
