name: adapter-dagster

on:
  push:
    paths:
      - "job_ftch/adapters/dagster/**"
      - "job_ftch/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "job_ftch/adapters/dagster/**"
      - "job_ftch/**"

permissions:
  contents: read

jobs:
  build:
    name: Lint & build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Lint adapter
        run: uvx ruff check job_ftch/adapters/dagster
      - name: Build image
        run: docker build -f job_ftch/adapters/dagster/Dockerfile -t job-ftch-dagster .
