# CIS source enrichment batch for tenant ai_jobs (AI-automation + job-search profile).
# Focus: RU / KZ / UZ primary, BY secondary. Aggregators + top employers (fintech,
# telecom, big tech/product, AI startups). Consumed by scripts/import_sources.py,
# which turns each URL into a typed SourceSpec and registers it through
# TenantRunner.add_source_spec (runs source assessment, then persists to the store).
