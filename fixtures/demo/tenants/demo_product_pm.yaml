tenant_id: demo_product_pm
display_name: Demo — AI Product and Technical Program
enabled: true
source_backend: local_fixture
sources:
  - type: local_fixture
    path: fixtures/demo/sources/product_jobs.json
    source_name: product_board
    interval_seconds: 1800
  - type: local_fixture
    path: fixtures/demo/sources/product_edge_cases.json
    source_name: product_edge_cases
    interval_seconds: 3600
schedule:
  interval_seconds: 1800
  ingest_mode: polling
profile_path: fixtures/demo/profiles/product_pm.yaml
ontology_path: fixtures/demo/ontology_product_pm.json
pipeline_recipe_path: config/pipelines/demo_product_pm.yaml
retention_runs: 5
llm_backend: heuristic
allow_tenant_model_override: true
embedding_enabled: false
store_backend: sqlite
job_group_store_backend: sqlite
job_backend: sqlite
search_backend: sqlite
store_path: artifacts/demo/{tenant_id}/state.db
job_store_path: artifacts/demo/{tenant_id}/jobs.db
output:
  backend: json_file
  path: artifacts/demo/{tenant_id}/jobs.json
  jsonl: false
  schema_version: job_ftch.job.v1
review_output:
  path: artifacts/demo/{tenant_id}/review.jsonl
  jsonl: true
rejected_output:
  path: artifacts/demo/{tenant_id}/rejected.jsonl
  jsonl: true
quarantine_output:
  path: artifacts/demo/{tenant_id}/quarantine.jsonl
  jsonl: true
notify_mode: digest
notify_batch_size: 5
dry_run: false
pipeline_max_items_per_run: 20
source_fetch_concurrency: 1
pipeline_item_concurrency: 2
