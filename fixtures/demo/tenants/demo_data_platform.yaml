tenant_id: demo_data_platform
display_name: Demo — Data Platform Engineering
enabled: true
source_backend: local_fixture
sources:
  - type: local_fixture
    path: fixtures/demo/sources/data_platform_jobs.json
    source_name: data_platform_board
    interval_seconds: 900
  - type: local_fixture
    path: fixtures/demo/sources/engineering_edge_cases.json
    source_name: data_platform_edge_cases
    interval_seconds: 1800
schedule:
  interval_seconds: 900
  ingest_mode: polling
profile_path: fixtures/demo/profiles/data_platform.yaml
ontology_path: fixtures/demo/ontology_engineering.json
pipeline_recipe_path: config/pipelines/demo_engineering.yaml
llm_backend: heuristic
allow_tenant_model_override: true
embedding_enabled: false
store_backend: sqlite
job_group_store_backend: sqlite
job_backend: sqlite
search_backend: sqlite
store_path: artifacts/demo/{tenant_id}/state.db
job_store_path: artifacts/demo/{tenant_id}/jobs.db
output: {backend: json_file, path: "artifacts/demo/{tenant_id}/jobs.json", jsonl: false, schema_version: job_ftch.job.v1}
review_output: {path: "artifacts/demo/{tenant_id}/review.jsonl", jsonl: true}
rejected_output: {path: "artifacts/demo/{tenant_id}/rejected.jsonl", jsonl: true}
quarantine_output: {path: "artifacts/demo/{tenant_id}/quarantine.jsonl", jsonl: true}
pipeline_max_items_per_run: 20
source_fetch_concurrency: 1
pipeline_item_concurrency: 2
