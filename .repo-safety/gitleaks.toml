[extend]
useDefault = true

[allowlist]
description = "Repository-specific false positives and archived non-runtime artifacts"
paths = [
  '''^fixtures/real_world/failed_parsers_html/''',
  '''^plans/''',
  '''^\.env(?:\.[^/]+)?\.example$''',
  '''^job_ftch/adapters/telegram_bot/\.env(?:\.[^/]+)?\.example$''',
  '''^deploy/observability/\.env(?:\.[^/]+)?\.example$''',
  '''^job_ftch/infrastructure/sources/site_parsers/dynamitejobs\.py$''',
  '''^\.repo-safety[\\/]detect-secrets\.baseline$''',
  # The detect-secrets baseline stores hashed secret identities by design; gitleaks
  # flags every entry. Allowlist both the current path and the historical root name
  # (gitleaks scans full history, where the file was .secrets.baseline).
  '''^\.secrets\.baseline$''',
]
