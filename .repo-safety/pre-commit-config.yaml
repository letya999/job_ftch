repos:
  - repo: local
    hooks:
      - id: job-ftch-module-boundaries
        name: job_ftch module boundaries
        entry: uv run python scripts/check_module_boundaries.py
        language: system
        pass_filenames: false

      - id: forbid-sensitive-files
        name: forbid sensitive files
        entry: python .repo-safety/scripts/forbid_sensitive_files.py
        language: system
        pass_filenames: false

      - id: scan-mcp-config
        name: scan MCP config safety
        entry: python .repo-safety/scripts/scan_mcp_config.py
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: gitleaks - detect hardcoded secrets
        args:
          - '--config=.repo-safety/gitleaks.toml'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.repo-safety/detect-secrets.baseline'
          - '--exclude-files'
          - '^\.repo-safety[\\/]detect-secrets\.baseline$'
          # These versioned artifacts intentionally contain SHA-256 content
          # identities on nearly every line; entropy detection is not useful
          # for them. Gitleaks and the sensitive-file guard still scan them.
          - '--exclude-files'
          - '^(fixtures[\\/]dataset[\\/](patches|splits)[\\/].*|fixtures[\\/]prefilter[\\/]tfidf_logreg_v1\.json|config[\\/]recipes[\\/].*\.json|config[\\/](legacy_baselines[\\/]historical_86bc192|pipelines[\\/]historical_86bc192)\.yaml)$'
