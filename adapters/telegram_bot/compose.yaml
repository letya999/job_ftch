services:
  fastapi-bridge:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    command:
      - uvicorn
      - job_ftch.adapters.telegram_bot.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      JOB_FTCH_CONFIGS_DIR: /app/config
    volumes:
      - ../../config:/app/config
    ports:
      - "8080:8080"

  job_ftch-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    command:
      - job_ftch
      - mcp-server
      - --configs-dir
      - /app/config
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - ../../config:/app/config
    ports:
      - "8000:8000"
