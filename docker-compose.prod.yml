# Production stack — full image build, no volume mounts, hardened.
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  bot:
    build:
      context: .
      dockerfile: adapters/telegram_bot/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
      - adapters/telegram_bot/.env.prod
    environment:
      JOB_FTCH_STORE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-job_ftch}
      JOB_FTCH_QDRANT_URL: http://qdrant:6333
      JOB_FTCH_CONFIGS_DIR: /app/adapters/telegram_bot/config/tenants
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./.runtime:/app/.runtime

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-job_ftch}
    # No port exposure in prod — internal only
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-job_ftch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    # No port exposure in prod — internal only
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
