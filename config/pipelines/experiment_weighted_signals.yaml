extends: historical_best.yaml
name: experiment_weighted_signals
version: "1.0.0"
metadata:
  purpose: compare_typed_signal_aggregation
  experiment: {variable: decision_policy}
  decision_policy:
    mode: claims
    claims:
      profile_relevance:
        aggregation: weighted_mean
        accept_threshold: 0.60
        review_threshold: 0.50
        features:
          parallel_final_score: {transform: clamp01, weight: 0.70, independence_group: semantic_bge}
          llm_relevance: {transform: clamp01, weight: 0.30, independence_group: llm_judge}
        vetoes:
          - {name: quality_score, lt: 0.60}
