name: experiment_h17_compact_aggregator
version: "1.0.0"
metadata:
  purpose: cached_profile_brief_compact_item_prompt_and_deterministic_signal_aggregator
  experiment: {id: H17, control: asis_legacy_best}
  benchmark: {dataset: fixtures/dataset/eval_dataset.jsonl, sample: 140, seed: 42}
resources: {profile: active_profile, store: active_store, llm: active_llm, shots: active_shots}
nodes:
  - {id: sanitize, node: sanitize, effect: gate}
  - {id: snapshot_filter, node: snapshot_filter, effect: gate, after: [sanitize]}
  - {id: source_context, node: source_context, effect: observe, after: [snapshot_filter]}
  - {id: ontology_snapshot, node: ontology_snapshot, effect: observe, after: [source_context]}
  - {id: candidate_segmentation, node: candidate_segmentation, effect: observe, after: [ontology_snapshot]}
  - {id: garbage_filter, node: garbage_filter, effect: gate, after: [candidate_segmentation]}
  - {id: post_type, node: post_type, effect: observe, after: [garbage_filter]}
  - {id: hard_filter, node: hard_filter, effect: gate, after: [post_type]}
  - {id: dedup, node: dedup, effect: gate, after: [hard_filter]}
  - {id: bgem3, node: bgem3_embed, effect: observe, after: [dedup], timeout_ms: 180000, params: {model: BAAI/bge-m3}}
  - {id: semantic_prefilter, node: semantic_prefilter, effect: observe, after: [bgem3], params: {dense_margin_threshold: 0.05, rescue_logic: any_positive}}
  - {id: completeness, node: completeness_gate, effect: observe, after: [semantic_prefilter]}
  - {id: decision_extraction, node: decision_extraction, effect: observe, after: [completeness], params: {prompt_mode: compact, brief_max_chars: 2200}}
  - {id: extraction_validation, node: extraction_validation, effect: gate, after: [decision_extraction]}
  - {id: normalization, node: job_normalization, effect: observe, after: [extraction_validation]}
  - {id: lifecycle, node: lifecycle, effect: observe, after: [normalization]}
  - {id: profile_match, node: profile_match, effect: observe, after: [lifecycle]}
  - {id: parallel_scoring, node: parallel_scoring, effect: observe, after: [profile_match], params: {margin_k: 20}}
  - {id: risk, node: risk, effect: observe, after: [parallel_scoring]}
  - {id: quality, node: quality, effect: observe, after: [risk]}
  - {id: decision_aggregator, node: decision_aggregator, effect: terminal_decision, after: [quality], params: {accept_profile_score: 0.55, review_profile_score: 0.35, accept_llm_confidence: 0.55}}
  - {id: accept_template_presentation, node: accept_template_presentation, effect: observe, after: [decision_aggregator]}
  - {id: aggregation, node: aggregation, effect: side_effect, after: [accept_template_presentation]}
