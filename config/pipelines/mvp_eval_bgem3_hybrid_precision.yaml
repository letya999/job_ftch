extends: mvp_eval_no_bge.yaml
name: mvp_eval_bgem3_hybrid_precision
version: "1.0.0"
metadata:
  purpose: one_sided_bgem3_llm_cost_precision_experiment
  benchmark: {dataset: fixtures/dataset/eval_dataset_fixed140_seed42_v1.jsonl, sample: 140, seed: 42, tenant_id: ai_jobs, user_id: "480637186"}
  runtime:
    models: {extraction: gpt-4.1-nano, relevance: gpt-4.1-mini}
    shots: {backend: qdrant, source: user_db_only, collection: profile_shots_bgem3_mvp_v3}
  policy:
    promotion: experimental_only
    rationale: >-
      BGE may prove only a low-confidence negative candidate for LLM-call
      avoidance. It never accepts a vacancy; every non-low-score candidate
      still requires relevance-LLM evidence.
nodes:
  - {id: bgem3_embed, node: bgem3_embed, effect: observe, after: [dedup], params: {model: BAAI/bge-m3, max_chars: 4096}}
  - {id: semantic_prefilter, node: semantic_prefilter, effect: observe, after: [bgem3_embed], params: {dense_margin_threshold: 0.05, rescue_logic: strong_ai_signal}}
  - {id: extraction, after: [semantic_prefilter]}
  - {id: lifecycle, node: lifecycle, effect: observe, after: [compensation]}
  - {id: profile_match, node: profile_match, effect: observe, after: [lifecycle]}
  - {id: parallel_scoring, node: parallel_scoring, effect: observe, after: [profile_match], params: {margin_k: 12, w_dense: 0.65, w_sparse: 0.35, w_role: 0.0}}
  # One-sided policy: score < 0.20 may avoid relevance-mini; high scores never auto-accept.
  - {id: llm_relevance, after: [parallel_scoring], params: {call_policy: threshold, low_threshold: 0.20, high_threshold: 1.0, max_per_run: 500}}
  - {id: legacy_routing, after: [llm_relevance], params: {accept_threshold: 1.0, review_threshold: 1.0, quality_override_threshold: 1.0}}
