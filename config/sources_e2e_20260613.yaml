  # ─── Russian-language job aggregators ────────────────────────────────────────
  # HH.ru — SSR page (vacancies in HTML, dom monitor finds /vacancy/\d+ links)
  - type: career_site
    url: https://hh.ru/vacancies/python-developer
    source_name: hh_ru
    monitor: dom
    url_filter: "/vacancy/\\d+"
    limit: 5

  # HH.kz — same SSR approach for Kazakhstan
  - type: career_site
    url: https://hh.kz/vacancies/python-developer
