# Optional readiness gate. Offline Android never consumes upstream attempts.
# YAML maps replace previous maps; these definitions include the queue profile.
llm_provider_profiles:
  openai_main:
    backend: openai
    capabilities: [text, structured]
  cliproxy_main:
    backend: openai
    base_url: http://cliproxy:8317/v1
    credential_ref: JOB_FTCH_CLIPROXY_API_KEY
    structured_mode: json
    capabilities: [text, structured]
    execution: queued
    quota_scope: google_primary
    session_affinity: true
    egress_ready_url: http://llm-home-egress:1054/ready
  cliproxy_captcha:
    backend: openai
    base_url: http://cliproxy:8317/v1
    credential_ref: JOB_FTCH_CLIPROXY_API_KEY
    capabilities: [vision]
    execution: queued
    quota_scope: google_primary
    session_affinity: true
    egress_ready_url: http://llm-home-egress:1054/ready
