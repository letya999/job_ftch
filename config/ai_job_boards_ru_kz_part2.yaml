sources:
  # --- HH.kz ---
  - type: career_site
    url: https://hh.kz/vacancies/data-scientist
    source_name: hhkz_ds
    monitor: dom
    monitor_config:
      url_filter: "hh\\.kz/vacancy/\\d+"
    limit: 50

  - type: career_site
    url: https://hh.kz/vacancies/machine-learning-engineer
    source_name: hhkz_mle
    monitor: dom
    monitor_config:
      url_filter: "hh\\.kz/vacancy/\\d+"
    limit: 50

  # --- KZ job boards ---
  - type: career_site
    url: "https://qyzmet.kz/%D0%B2%D0%B0%D0%BA%D0%B0%D0%BD%D1%81%D0%B8%D0%B8/Data-scientist"
    source_name: qyzmet_ds
    monitor: dom
    monitor_config:
      expand_links: "qyzmet\\.kz/.*/Data-scientist/.+"
      url_filter: "qyzmet\\.kz/jobdesc\\?id=\\d+"
    limit: 50

  - type: career_site
    url: https://kazahstan.gorodrabot.kz/data_scientist
    source_name: gorodrabot_ds
    monitor: dom
    monitor_config:
      url_filter: "gorodrabot\\.kz/advert/\\d+"
    limit: 50

  - type: career_site
    url: "https://gderabota.ru/%D0%B2%D0%B0%D0%BA%D0%B0%D0%BD%D1%81%D0%B8%D0%B8/data-scientist"
    source_name: gderabota_ds
    monitor: dom
    monitor_config:
      url_filter:
        include: "(career\\.wb\\.ru/vacancies/\\d+|yandex\\.ru/jobs/vacancies/[a-z0-9-]+|gorodrabot\\.ru/advert/\\d+|gderabota\\.ru/.*/вакансии/[a-z0-9а-я-]+)"
    limit: 50

  # --- Company career pages ---
  - type: career_site
    url: https://www.tbank.ru/career/vacancies/it/
    source_name: tbank_it
    monitor: dom
    monitor_config:
      url_filter: "tbank\\.ru/career/it/vacancy/[a-z0-9\\-/]+"
    limit: 50

  - type: career_site
    url: "https://www.tbank.ru/career/vacancies/it/?tcareer_it_profession=ml"
    source_name: tbank_ml
    monitor: dom
    monitor_config:
      url_filter: "tbank\\.ru/career/it/vacancy/[a-z0-9\\-/]+"
    limit: 50

  - type: career_site
    url: https://career.avito.com/vacancies/
    source_name: avito_career
    monitor: dom
    monitor_config:
      url_filter: "career\\.avito\\.com/vacancies/[^/]+/\\d+/?$"
    limit: 50

  - type: career_site
    url: https://ozon.tech/vacancies/
    source_name: ozon_tech
    monitor: dom
    monitor_config:
      render: true
      channel: chrome
      settle_seconds: 6
      include_if_detail_page: false
      url_filter: "ozon\\.tech/vacancies/[a-f0-9\\-]+-[a-z0-9-]+/?$"
    limit: 50

  - type: career_site
    url: https://team.vk.company/vacancies/
    source_name: vk_careers
    monitor: dom
    monitor_config:
      url_filter: "team\\.vk\\.company/vacancy/\\d+/?$"
    limit: 50

  - type: career_site
    url: https://kolesa.group/career/job
    source_name: kolesa_career
    monitor: dom
    monitor_config:
      url_filter: "kolesa\\.group/career/job/[a-z0-9-]+-\\d+"
    limit: 50

  - type: career_site
    url: https://people.beeline.kz/
    source_name: beeline_kz
    monitor: api_sniffer
    monitor_config:
      persistent_context: true
      channel: chrome
      settle_seconds: 5
    limit: 50
