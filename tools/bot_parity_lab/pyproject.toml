[project]
name = "bot-browser-parity-lab"
version = "0.1.0"
description = "Local defensive browser/network parity lab for auditing owned automation clients"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Local defensive lab"}]
dependencies = [
  "cryptography==50.0.0",
  "httpx[http2]==0.28.1",
  "hypercorn[h3]==0.18.0",
  "maxminddb==3.1.1",
  "starlette==1.3.1",
]

[project.optional-dependencies]
# Camoufox 0.5.x shares Playwright's Python API and currently requires <1.61.
# Keep the aggregate extras jointly resolvable; isolated newer-Playwright trials
# belong in a separate environment and are recorded as distinct baselines.
browsers = ["playwright>=1.60,<1.61"]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
]
patchright = ["patchright==1.61.2"]
nodriver = ["nodriver==0.50.3"]
camoufox = ["camoufox==0.5.4"]

[project.scripts]
paritylab = "paritylab.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paritylab"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["paritylab/**", "tests/**", "examples/project_hook.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["paritylab/static"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
